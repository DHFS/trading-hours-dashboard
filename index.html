<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>交易时段看板 · 北京时间</title>
  <meta name="theme-color" content="#121418" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="交易时钟" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <meta name="description" content="以北京时间为基准的全球交易时段看板：A股、港股、日经、美股、加密货币实时开休市状态与行情。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet" />
  <script>
    // 每次打开生成新的资源版本号，绕过 iOS 主屏 PWA / CDN 对静态文件的缓存，
    // 确保改版后无需手动强刷即可加载最新 style.css / app.js（脚本在 body 末尾以此版本号注入）。
    window.THD_VER = Date.now().toString(36);
    document.write('<link rel="stylesheet" href="style.css?v=' + window.THD_VER + '">');
  </script>
</head>
<body>
  <div class="rotate-hint">请横屏使用</div>
  <div class="announce">全球交易时段 · 以北京时间为基准（UTC+8）</div>

  <div class="container">
    <header class="hero">
      <div class="hero-left">
        <div class="kicker">Market Hours · Asia/Shanghai</div>
        <h1>交易时段看板</h1>
        <div id="date-line">—</div>
        <div id="day-tip"><span class="dot"></span><span id="day-tip-text">—</span></div>
      </div>
      <div class="hero-right">
        <div id="clock">--:--:--</div>
        <div class="tz">北京时间 UTC+8</div>
      </div>
    </header>

    <div id="data-warning" class="data-warning" hidden>
      节假日数据仅覆盖 2026 年，当前日期已超出覆盖范围，时段判定可能不准确，请更新 data.js。
    </div>

    <main id="grid" class="grid"></main>

    <footer>
      <div class="legend" id="legend"></div>
      <div class="src" id="src"></div>
    </footer>
  </div>

  <script>
    // 用同一个动态版本号加载脚本，绕过 iOS 主屏 PWA 的静态文件缓存，改版后自动生效。
    document.write('<script src="data.js?v=' + window.THD_VER + '"><\/script>');
    document.write('<script src="app.js?v=' + window.THD_VER + '"><\/script>');
  </script>
  <script>
    // 注册 Service Worker：同源资源网络优先，破解 iOS 主屏 PWA 缓存旧文件导致改版不生效。
    // 新 SW 接管后自动刷新一次，让本次打开立刻用上新版（用 sessionStorage 防循环刷新）。
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').then(function (reg) {
          const fresh = !navigator.serviceWorker.controller; // 本次由旧页面/无 SW 提供
          reg.addEventListener('updatefound', function () {
            const nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', function () {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                if (!sessionStorage.getItem('thd_sw_reloaded')) {
                  sessionStorage.setItem('thd_sw_reloaded', '1');
                  window.location.reload();
                }
              }
            });
          });
        }).catch(function () {});
      });
    }
  </script>
</body>
</html>
